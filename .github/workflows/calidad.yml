name: Calidad backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    # 20 y no 15: el paso de MySQL añade la descarga de la imagen 8.0.44 y su
    # arranque, un par de minutos. Mejor margen que un trabajo cancelado a
    # mitad, que se lee como fallo y no lo es.
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://crm_app:crm_dev_local@localhost:5433/crm_test?schema=public
      DOTENV_CONFIG_PATH: /dev/null
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm_app
          POSTGRES_PASSWORD: crm_dev_local
          # Las suites atencion-humana e interacciones usan una URL fija SIN contraseña: con la
          # autenticación por contraseña se colgaban hasta el límite del trabajo. Solo este contenedor desechable.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: crm_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U crm_app -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/prisma/build/index.js migrate deploy
      - run: npm run build
      - run: npm run check:tests
      - run: npm run test:build
      - run: npm test -- --runInBand
      - run: npm run test:integracion
      # La suite MySQL de la agenda: 16 pruebas que se saltaban solas porque
      # `AGENDA_MYSQL_TEST` no estaba puesto en ninguna parte, así que nada las
      # corría —ni aquí ni en local salvo que alguien se acordara del script—.
      # Una prueba que nada ejecuta se pudre. El script levanta su propio MySQL
      # 8.0.44 (misma versión que el VPS, imagen fijada por digest), en el 3307,
      # lo siembra con `test/agenda/legado-sintetico.sql` y lo borra al salir:
      # nunca toca la agenda real.
      - run: npm run test:agenda-mysql
