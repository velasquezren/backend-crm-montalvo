name: Calidad backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://crm_app:crm_dev_local@localhost:5433/crm_test?schema=public
      DOTENV_CONFIG_PATH: /dev/null
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm_app
          POSTGRES_PASSWORD: crm_dev_local
          # Las suites atencion-humana e interacciones usan una URL fija SIN contraseña: con la
          # autenticación por contraseña se colgaban hasta el límite del trabajo. Solo este contenedor desechable.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: crm_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U crm_app -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/prisma/build/index.js migrate deploy
      - run: npm run build
      - run: npm run check:tests
      - run: npm run test:build
      - run: npm test -- --runInBand
      - run: npm run test:integracion
